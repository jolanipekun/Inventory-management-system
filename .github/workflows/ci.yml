name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ================================
  # FRONTEND
  # ================================
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./  # root (where vite.config.js lives)
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run frontend build
        run: npm run build

      - name: Run frontend tests
        run: npm test

  # ================================
  # BACKEND
  # ================================
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  # ================================
  # PYTHON TESTS (optional)
  # ================================
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-tests  # adjust if needed
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: pytest
